<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Борис Jump</title><style>body{margin:0;background:#c9efff;font-family:system-ui;text-align:center;color:#142d40}h2{margin:8px}canvas{display:block;margin:auto;max-width:100vw;touch-action:none;background:#bdeaff}button{font-size:30px;padding:12px 35px;margin:6px;border-radius:16px;border:0;background:white;touch-action:none}</style></head><body><h2>🐷 Борис Jump</h2><canvas id="c" width="360" height="600"></canvas><div><button id="l">◀</button><button id="r">▶</button></div><p>Пружины и ракеты ускоряют Бориса! Нажми поле после проигрыша.</p><script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),pig=new Image();pig.src='pig.png';let L=false,R=false,over=false,score=0,cam=0,player,plats,boosts,enemies,enemyClock=0;
function init(){score=cam=0;over=false;enemyClock=0;player={x:148,y:440,vx:0,vy:-9,w:64,h:48};plats=[];boosts=[];enemies=[];for(let i=0;i<9;i++)plats.push({x:Math.random()*275,y:520-i*70,w:70+Math.random()*30,h:13,type:i===0?'normal':Math.random()<.23?'fragile':'normal',used:false});}
init();function ctl(id,set){let b=document.getElementById(id);b.onpointerdown=e=>{e.preventDefault();set(true)};b.onpointerup=b.onpointercancel=b.onpointerleave=()=>set(false)}ctl('l',v=>L=v);ctl('r',v=>R=v);window.onkeydown=e=>{if(e.key==='ArrowLeft'||e.key==='a')L=true;if(e.key==='ArrowRight'||e.key==='d')R=true};window.onkeyup=e=>{if(e.key==='ArrowLeft'||e.key==='a')L=false;if(e.key==='ArrowRight'||e.key==='d')R=false};c.onclick=()=>{if(over)init()};
function spawnBoost(){let top=Math.min(...plats.map(a=>a.y));if(Math.random()<.32)boosts.push({x:Math.random()*300,y:top-45,type:Math.random()<.5?'spring':'rocket',used:false});}
function spawnEnemy(){if(score>=5000&&Math.random()<.018){let top=Math.min(...plats.map(a=>a.y));enemies.push({x:Math.random()*300,y:top-65,w:44,h:48,dir:Math.random()<.5?-1:1});}}
function draw(){ctx.fillStyle='#bdeaff';ctx.fillRect(0,0,360,600);ctx.fillStyle='#fff';for(let i=0;i<6;i++){ctx.beginPath();ctx.arc((i*73+30)%360,60+i*94,22,0,6.28);ctx.fill()}
plats.forEach(a=>{ctx.fillStyle=a.type==='fragile'?'#dca44b':'#49b957';ctx.fillRect(a.x,a.y,a.w,a.h);ctx.fillStyle=a.type==='fragile'?'#a16b25':'#258a38';ctx.fillRect(a.x,a.y+a.h-3,a.w,3)});
boosts.forEach(b=>{if(b.used)return;if(b.type==='spring'){ctx.fillStyle='#ff5a9a';ctx.fillRect(b.x+9,b.y+12,16,15);ctx.strokeStyle='#333';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(b.x+17,b.y+12);ctx.lineTo(b.x+9,b.y+7);ctx.lineTo(b.x+25,b.y+2);ctx.stroke()}else{ctx.font='28px serif';ctx.fillText('🚀',b.x,b.y+28)}});
enemies.forEach(e=>{ctx.fillStyle='#42546a';ctx.fillRect(e.x,e.y+8,e.w,e.h-8);ctx.fillStyle='#263447';ctx.fillRect(e.x+5,e.y,e.w-10,15);ctx.fillStyle='#ffcf70';ctx.fillRect(e.x+12,e.y+20,20,7);ctx.fillStyle='#111';ctx.fillRect(e.x+8,e.y+35,10,12);ctx.fillRect(e.x+26,e.y+35,10,12)});
if(pig.complete)ctx.drawImage(pig,player.x,player.y,player.w,player.h);else{ctx.font='48px serif';ctx.fillText('🐷',player.x,player.y+42)}ctx.fillStyle='#123';ctx.font='bold 22px system-ui';ctx.fillText('Счёт: '+score,12,30);if(score>=5000){ctx.font='13px system-ui';ctx.fillText('⚠️ Враги появились!',12,50)}if(over){ctx.fillStyle='#0009';ctx.fillRect(0,0,360,600);ctx.fillStyle='white';ctx.textAlign='center';ctx.font='bold 32px system-ui';ctx.fillText('БОРИС УПАЛ!',180,260);ctx.font='22px system-ui';ctx.fillText('Счёт: '+score,180,305);ctx.fillText('Нажми экран для рестарта',180,350);ctx.textAlign='left'}}
function loop(){if(!over){player.vx=(L?-5:0)+(R?5:0);player.x+=player.vx;if(player.x>360)player.x=-player.w;if(player.x<-player.w)player.x=360;player.vy+=.32;player.y+=player.vy;
// narrower collision box around pig body
let hx=player.x+12,hw=player.w-24,hy=player.y+8,hh=player.h-12;
plats.forEach(a=>{if(player.vy>0&&!a.used&&hx+hw>a.x&&hx<a.x+a.w&&hy+hh>=a.y&&hy+hh<a.y+a.h+14){player.vy=-10;if(a.type==='fragile')a.used=true}});
boosts.forEach(b=>{if(!b.used&&hx+hw>b.x&&hx<b.x+32&&hy+hh>b.y&&hy<b.y+35){b.used=true;player.vy=b.type==='rocket'?-19:-14}});
enemies.forEach(e=>{e.x+=e.dir*1.1;if(e.x<0||e.x>316)e.dir*=-1;if(hx+hw>e.x&&hx<e.x+e.w&&hy+hh>e.y&&hy<e.y+e.h){over=true}});
if(player.y<210){let d=210-player.y;player.y=210;cam+=d;score=Math.floor(cam);plats.forEach(a=>a.y+=d);boosts.forEach(b=>b.y+=d);enemies.forEach(e=>e.y+=d)}plats=plats.filter(a=>a.y<620&&!a.used);boosts=boosts.filter(b=>b.y<620&&!b.used);enemies=enemies.filter(e=>e.y<620);
while(plats.length<8){let top=plats.length?Math.min(...plats.map(a=>a.y)):0;plats.push({x:Math.random()*270,y:top-65-Math.random()*35,w:70+Math.random()*30,h:13,type:Math.random()<.3?'fragile':'normal',used:false});spawnBoost();spawnEnemy()}if(player.y>620)over=true}draw();requestAnimationFrame(loop)}loop();
</script></body></html>
